# Shipped installation templates (seed for SQLite on first run).
# Editable from Configuration → Templates; Pi runtime state stays in sa-config.yaml.

default_template: "Chwarznienska 9kW"

templates:
  "Chwarznienska 9kW":
    debug_tab_enabled: false
    location:
      latitude: 54.5
      longitude: 18.5
    solar:
      azimuth: 187
      system_loss_factor: 0.93
      blocks:
        - power_kwp: 1.5
          tilt: 35
        - power_kwp: 5.0
          tilt: 25
        - power_kwp: 2.5
          tilt: 65
    inverter:
      ac_capacity_kw: 8.0
    battery:
      capacity_kwh: 43.0
      max_charge_power_kw: 9.2
      max_discharge_power_kw: 8.0
    ev:
      max_power_kw: 11.0
    simulation:
      min_soc_pct: 16
      epsilon_kwh: 0.05
      default_charge_rate_kw: 2
      morning_surplus_break_hour: 8
      losses_pct:
        grid_to_battery: 7.5
        battery_to_load_or_grid: 7.5
        pv_to_battery: 7.5
        pv_to_grid: 7.5
        pv_to_load: 7.5
    timer_schedule:
      min_block_minutes: 30
      min_hourly_transfer_kwh: 2.0
    grid:
      feed_in_price_pln: 0.2
      grid_export_threshold_pln_kwh: 0.6229
      export_window_start_hour: 16
      night_charge_start: "23:00"
      night_charge_end: "06:00"
      rce_peak_start: "17:00"
      rce_peak_end: "23:00"
      g12:
        tariff_name: "Energa G12"
        tariff_preset: "G12"
        peak_price_pln_kwh: 1.2444
        offpeak_price_pln_kwh: 0.6229
        peak_energy_only_pln_kwh: 0.7182
        offpeak_energy_only_pln_kwh: 0.4678
      distribution:
        subscription_pln_month: 0.9102
        fixed_network_pln_month: 24.8091
        capacity_pln_month: 29.5815
        peak_variable_network_pln_kwh: 0.4728
        offpeak_variable_network_pln_kwh: 0.1017
        quality_pln_kwh: 0.0408
        oze_pln_kwh: 0.009
        cogeneration_pln_kwh: 0.0037
    load:
      hourly_profile_kwh:
        - 0.4
        - 0.3
        - 0.28
        - 0.28
        - 0.28
        - 0.3
        - 0.4
        - 0.6
        - 0.8
        - 0.7
        - 0.6
        - 0.6
        - 0.7
        - 0.7
        - 0.6
        - 0.6
        - 0.7
        - 0.9
        - 1.0
        - 0.9
        - 0.8
        - 0.7
        - 0.6
        - 0.5
    sa:
      host: "localhost"
      metrics:
        battery_soc: "battery_1/state_of_charge"
        battery_power: "battery_1/power"
        pv_power: "total/pv_power"
        load_power: "total/load_power"
        grid_power: "total/grid_power"
        pv_energy_today: "total/pv_power"
        load_energy_today: "total/load_power"
        grid_buy_energy: "total/grid_power"
        grid_sell_energy: "total/grid_power"
        battery_charged_today: "total/battery_energy_in"
        battery_discharged_today: "total/battery_energy_out"
      settings:
        charge_current_limit: "inverter_1/max_grid_charge_current"
        grid_charge_switch: "inverter_1/grid_charge"
        grid_export_switch: "inverter_1/timed_discharge"
